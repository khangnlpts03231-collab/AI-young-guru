<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thời Khóa Biểu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f4ff;
  --white: #ffffff;
  --primary: #4f46e5;
  --primary-light: #818cf8;
  --primary-pale: #eef2ff;
  --accent: #f59e0b;
  --accent-pale: #fffbeb;
  --green: #10b981;
  --green-pale: #ecfdf5;
  --red: #ef4444;
  --red-pale: #fef2f2;
  --pink: #ec4899;
  --text: #1e1b4b;
  --text-mid: #6b7280;
  --text-light: #9ca3af;
  --border: #e5e7eb;
  --shadow: 0 4px 24px rgba(79,70,229,0.10);
  --shadow-lg: 0 12px 40px rgba(79,70,229,0.16);
  --radius: 16px;
}

body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}

/* ── HEADER ── */
.header {
  background: var(--primary);
  background: linear-gradient(135deg, #312e81 0%, #4f46e5 60%, #7c3aed 100%);
  padding: 24px 28px 20px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 220px; height: 220px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 40%;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}

.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: relative;
  z-index: 2;
}

.header-title-wrap {}

.header-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin-bottom: 4px;
}

.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  color: white;
}

.header-today {
  text-align: right;
}

.today-date {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}

.today-full {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  margin-top: 2px;
}

/* Week nav */
.week-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  position: relative;
  z-index: 2;
}

.week-range {
  font-size: 14px;
  font-weight: 600;
  color: white;
}

.week-btns {
  display: flex;
  gap: 8px;
}

.week-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  width: 34px; height: 34px;
  color: white;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}

.week-btn:hover { background: rgba(255,255,255,0.25); }

.week-today-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 0 14px;
  height: 34px;
  color: white;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Be Vietnam Pro', sans-serif;
  transition: all 0.2s;
}

.week-today-btn:hover { background: rgba(255,255,255,0.25); }

/* ── DAY TABS ── */
.day-tabs {
  display: flex;
  gap: 0;
  padding: 0 20px;
  background: white;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}

.day-tabs::-webkit-scrollbar { display: none; }

.day-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 16px 12px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  min-width: 70px;
  flex: 1;
  position: relative;
}

.day-tab:hover { background: var(--primary-pale); }

.day-tab.active {
  border-bottom-color: var(--primary);
}

.day-name {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.day-tab.active .day-name { color: var(--primary); }

.day-num {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-mid);
  line-height: 1;
}

.day-tab.active .day-num { color: var(--primary); }

.day-tab.today .day-num {
  background: var(--primary);
  color: white;
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
}

.day-tab.today .day-name { color: var(--primary); }

.day-badge {
  position: absolute;
  top: 10px; right: 10px;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
}

/* ── MAIN ── */
.main {
  padding: 20px;
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
}

/* Add event btn */
.add-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.add-btn {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 11px 20px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Be Vietnam Pro', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(79,70,229,0.3);
}

.add-btn:hover {
  background: #4338ca;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(79,70,229,0.4);
}

.view-toggle {
  display: flex;
  background: white;
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  margin-left: auto;
}

.view-btn {
  padding: 10px 14px;
  border: none;
  background: none;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-mid);
  cursor: pointer;
  font-family: 'Be Vietnam Pro', sans-serif;
  transition: all 0.2s;
}

.view-btn.active {
  background: var(--primary-pale);
  color: var(--primary);
  font-weight: 600;
}

/* ── EVENT LIST ── */
.events-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.no-events {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-light);
}

.no-events .no-icon { font-size: 48px; margin-bottom: 12px; }
.no-events p { font-size: 14px; }

/* EVENT CARD */
.event-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--primary);
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
  animation: slideIn 0.25s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.event-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.event-card.done { opacity: 0.55; }
.event-card.done .event-title { text-decoration: line-through; }

.event-time-col {
  min-width: 68px;
  text-align: center;
}

.event-time-start {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}

.event-time-end {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 3px;
}

.event-dot {
  width: 2px;
  background: var(--border);
  margin: 6px auto;
  height: 14px;
}

.event-body { flex: 1; min-width: 0; }

.event-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.event-note {
  font-size: 12.5px;
  color: var(--text-mid);
  line-height: 1.5;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.event-tags { display: flex; gap: 6px; flex-wrap: wrap; }

.event-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
  background: var(--primary-pale);
  color: var(--primary);
}

.event-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.event-card:hover .event-actions { opacity: 1; }

.event-action-btn {
  width: 28px; height: 28px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}

.btn-edit { background: var(--primary-pale); color: var(--primary); }
.btn-done { background: var(--green-pale); color: var(--green); }
.btn-del { background: var(--red-pale); color: var(--red); }

.btn-edit:hover { background: var(--primary); color: white; }
.btn-done:hover { background: var(--green); color: white; }
.btn-del:hover { background: var(--red); color: white; }

/* ── WEEK VIEW ── */
.week-view {
  display: none;
  background: white;
  border-radius: var(--radius);
  overflow: auto;
  box-shadow: var(--shadow);
}

.week-view.active { display: block; }

.week-grid-header {
  display: grid;
  grid-template-columns: 60px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  min-width: 860px;
}

.wgh-cell {
  padding: 10px 6px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-mid);
  border-right: 1px solid var(--border);
}

.wgh-cell:last-child { border-right: none; }
.wgh-cell.today-col { background: var(--primary-pale); color: var(--primary); }

.wgh-date { font-size: 16px; font-weight: 700; margin-top: 2px; }

.week-time-grid { position: relative; }

.week-time-row {
  display: grid;
  grid-template-columns: 60px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  min-height: 50px;
  min-width: 860px;
}

.wtr-time {
  padding: 6px 8px;
  font-size: 11px;
  color: var(--text-light);
  text-align: right;
  border-right: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
}

.wtr-cell {
  border-right: 1px solid rgba(229,231,235,0.6);
  position: relative;
  min-height: 50px;
  transition: background 0.2s;
}

.wtr-cell:last-child { border-right: none; }
.wtr-cell:hover { background: rgba(79,70,229,0.03); }
.wtr-cell.today-col { background: rgba(79,70,229,0.02); }

.week-event-block {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 11px;
  font-weight: 600;
  overflow: hidden;
  cursor: pointer;
  transition: filter 0.2s;
}

.week-event-block:hover { filter: brightness(0.92); }

/* ── MODAL ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,27,75,0.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.show { display: flex; }

.modal {
  background: white;
  border-radius: 20px;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(30,27,75,0.3);
  animation: modalIn 0.25s cubic-bezier(.34,1.4,.64,1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.92) translateY(16px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  background: linear-gradient(135deg, #312e81, #4f46e5);
  padding: 20px 24px;
  border-radius: 20px 20px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: white;
}

.modal-close {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}

.modal-close:hover { background: rgba(255,255,255,0.25); }

.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.form-group { display: flex; flex-direction: column; gap: 6px; }

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-mid);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-input, .form-textarea, .form-select {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'Be Vietnam Pro', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--primary);
}

.form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Color picker */
.color-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.color-opt {
  width: 28px; height: 28px;
  border-radius: 8px;
  cursor: pointer;
  border: 3px solid transparent;
  transition: all 0.15s;
}

.color-opt:hover { transform: scale(1.15); }
.color-opt.selected { border-color: var(--text); transform: scale(1.1); }

/* modal footer */
.modal-footer {
  padding: 0 24px 24px;
  display: flex;
  gap: 10px;
}

.btn-cancel {
  flex: 1;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-mid);
  cursor: pointer;
  font-family: 'Be Vietnam Pro', sans-serif;
  transition: all 0.2s;
}

.btn-cancel:hover { border-color: var(--text-mid); }

.btn-save {
  flex: 2;
  background: var(--primary);
  border: none;
  border-radius: 10px;
  padding: 11px;
  font-size: 14px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  font-family: 'Be Vietnam Pro', sans-serif;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(79,70,229,0.3);
}

.btn-save:hover { background: #4338ca; }

/* ── DETAIL MODAL ── */
.detail-modal {
  background: white;
  border-radius: 20px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 24px 64px rgba(30,27,75,0.3);
  animation: modalIn 0.25s cubic-bezier(.34,1.4,.64,1);
  overflow: hidden;
}

.detail-color-bar {
  height: 8px;
}

.detail-body { padding: 24px; }

.detail-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.detail-time {
  font-size: 14px;
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 14px;
}

.detail-note {
  font-size: 14px;
  color: var(--text-mid);
  line-height: 1.65;
  background: var(--bg);
  padding: 12px 14px;
  border-radius: 10px;
  margin-bottom: 16px;
}

.detail-actions {
  display: flex;
  gap: 8px;
}

.detail-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Be Vietnam Pro', sans-serif;
  transition: all 0.2s;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.stat-pill {
  background: white;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-mid);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-pill .stat-n {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
}

/* ── RESPONSIVE ── */
@media (min-width: 1024px) {
  .header {
    padding: 28px 34px 24px;
  }

  .header-title {
    font-size: 32px;
  }

  .header-label {
    font-size: 12px;
  }

  .main {
    padding: 26px;
  }
}

@media (max-width: 520px) {
  .main { padding: 14px; }
  .form-row { grid-template-columns: 1fr; }
  .header { padding: 18px 16px 16px; }
  .day-tab { min-width: 54px; padding: 12px 8px; }
  .header-top {
    flex-direction: column;
    gap: 10px;
  }
  .header-today {
    text-align: left;
  }
  .week-nav {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .week-btns {
    width: 100%;
    justify-content: space-between;
  }
  .day-tabs {
    padding: 0 8px;
  }
  .event-card {
    padding: 14px 12px;
    gap: 10px;
  }
  .event-time-col {
    min-width: 60px;
  }
  .event-actions {
    opacity: 1;
    flex-direction: row;
  }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="header-title-wrap">
      <div class="header-label">📅 Lịch học & làm việc</div>
      <div class="header-title">Thời Khóa Biểu</div>
    </div>
    <div class="header-today">
      <div class="today-date" id="todayDate"></div>
      <div class="today-full" id="todayFull"></div>
    </div>
  </div>
  <div class="week-nav">
    <div class="week-range" id="weekRange"></div>
    <div class="week-btns">
      <button class="week-btn" onclick="shiftWeek(-1)">‹</button>
      <button class="week-today-btn" onclick="goToday()">Hôm nay</button>
      <button class="week-btn" onclick="shiftWeek(1)">›</button>
    </div>
  </div>
</div>

<!-- DAY TABS -->
<div class="day-tabs" id="dayTabs"></div>

<!-- MAIN -->
<div class="main">
  <div class="add-bar">
    <button class="add-btn" onclick="openAdd()">＋ Thêm lịch</button>
    <div class="view-toggle">
      <button class="view-btn active" id="btnDay" onclick="setView('day')">Ngày</button>
      <button class="view-btn" id="btnWeek" onclick="setView('week')">Tuần</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <!-- Day view -->
  <div id="dayView">
    <div class="events-list" id="eventsList"></div>
  </div>

  <!-- Week view -->
  <div id="weekViewWrap" style="display:none">
    <div class="week-view active" id="weekView"></div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">➕ Thêm lịch mới</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">📌 Tên môn / công việc</label>
        <input type="text" class="form-input" id="fTitle" placeholder="VD: Toán cao cấp, Họp nhóm...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">🕐 Giờ bắt đầu</label>
          <input type="time" class="form-input" id="fStart" value="08:00">
        </div>
        <div class="form-group">
          <label class="form-label">🕓 Giờ kết thúc</label>
          <input type="time" class="form-input" id="fEnd" value="09:30">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">📆 Ngày trong tuần</label>
        <select class="form-select" id="fDay">
          <option value="0">Thứ Hai</option>
          <option value="1">Thứ Ba</option>
          <option value="2">Thứ Tư</option>
          <option value="3">Thứ Năm</option>
          <option value="4">Thứ Sáu</option>
          <option value="5">Thứ Bảy</option>
          <option value="6">Chủ Nhật</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">🏷️ Nhãn</label>
        <input type="text" class="form-input" id="fTag" placeholder="VD: Học, Làm việc, Cá nhân...">
      </div>
      <div class="form-group">
        <label class="form-label">📝 Ghi chú</label>
        <textarea class="form-textarea" id="fNote" placeholder="Thêm ghi chú, địa điểm, tài liệu cần mang..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">🎨 Màu sắc</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-opt selected" data-color="#4f46e5" style="background:#4f46e5" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#10b981" style="background:#10b981" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#f59e0b" style="background:#f59e0b" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#ef4444" style="background:#ef4444" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#ec4899" style="background:#ec4899" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#8b5cf6" style="background:#8b5cf6" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#06b6d4" style="background:#06b6d4" onclick="pickColor(this)"></div>
          <div class="color-opt" data-color="#84cc16" style="background:#84cc16" onclick="pickColor(this)"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-save" onclick="saveEvent()">💾 Lưu lịch</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="detail-modal">
    <div class="detail-color-bar" id="detailColorBar"></div>
    <div class="detail-body">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-time" id="detailTime"></div>
      <div class="detail-note" id="detailNote" style="display:none"></div>
      <div id="detailTag" style="margin-bottom:14px"></div>
      <div class="detail-actions">
        <button class="detail-btn" id="detailDoneBtn"
          style="background:var(--green-pale);color:var(--green)"
          onclick="toggleDone()">✓ Hoàn thành</button>
        <button class="detail-btn"
          style="background:var(--primary-pale);color:var(--primary)"
          onclick="editFromDetail()">✏️ Sửa</button>
        <button class="detail-btn"
          style="background:var(--red-pale);color:var(--red)"
          onclick="deleteFromDetail()">🗑 Xóa</button>
      </div>
    </div>
  </div>
</div>

<script>
// ──────────── STATE ────────────
const VI_DAYS = ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const VI_MONTHS = ['tháng 1','tháng 2','tháng 3','tháng 4','tháng 5','tháng 6',
                   'tháng 7','tháng 8','tháng 9','tháng 10','tháng 11','tháng 12'];

let events = JSON.parse(localStorage.getItem('tkb_events') || '[]');
let selectedDayIdx = 0; // 0=Mon..6=Sun in current week
let weekOffset = 0;     // weeks from current
let editingId = null;
let selectedColor = '#4f46e5';
let detailId = null;
let currentView = 'day';

// ──────────── DATE HELPERS ────────────
function getMonday(offset = 0) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day); // shift to Monday
  const mon = new Date(now);
  mon.setDate(now.getDate() + diff + offset * 7);
  mon.setHours(0,0,0,0);
  return mon;
}

function getWeekDays(offset = 0) {
  const mon = getMonday(offset);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function isToday(date) {
  const t = new Date();
  return date.getDate() === t.getDate() &&
         date.getMonth() === t.getMonth() &&
         date.getFullYear() === t.getFullYear();
}

function dateKey(date) {
  // returns "YYYY-MM-DD"
  return date.toISOString().slice(0,10);
}

function fmtDate(d) {
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}

// ──────────── HEADER ────────────
function renderHeader() {
  const now = new Date();
  const dayNames = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  document.getElementById('todayDate').textContent =
    `${dayNames[now.getDay()]}, ${now.getDate()}/${now.getMonth()+1}`;
  document.getElementById('todayFull').textContent =
    `Năm ${now.getFullYear()}`;

  const days = getWeekDays(weekOffset);
  const first = days[0], last = days[6];
  let rangeStr = '';
  if (first.getMonth() === last.getMonth()) {
    rangeStr = `${first.getDate()} – ${last.getDate()} ${VI_MONTHS[first.getMonth()]} ${first.getFullYear()}`;
  } else {
    rangeStr = `${first.getDate()} ${VI_MONTHS[first.getMonth()]} – ${last.getDate()} ${VI_MONTHS[last.getMonth()]} ${first.getFullYear()}`;
  }
  document.getElementById('weekRange').textContent = rangeStr;
}

// ──────────── DAY TABS ────────────
function renderDayTabs() {
  const days = getWeekDays(weekOffset);
  const tab = document.getElementById('dayTabs');
  tab.innerHTML = '';

  days.forEach((d, i) => {
    const hasEvents = events.some(e => e.dayKey === dateKey(d));
    const div = document.createElement('div');
    div.className = 'day-tab' +
      (i === selectedDayIdx ? ' active' : '') +
      (isToday(d) ? ' today' : '');
    div.innerHTML = `
      <div class="day-name">${VI_DAYS[i].split(' ')[1] || 'CN'}</div>
      <div class="day-num">${d.getDate()}</div>
      ${hasEvents ? '<div class="day-badge"></div>' : ''}`;
    div.onclick = () => { selectedDayIdx = i; renderAll(); };
    tab.appendChild(div);
  });
}

// ──────────── STATS ────────────
function renderStats() {
  const days = getWeekDays(weekOffset);
  const todayKey = dateKey(days[selectedDayIdx]);
  const todayEvents = events.filter(e => e.dayKey === todayKey);
  const done = todayEvents.filter(e => e.done).length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><span class="stat-n">${todayEvents.length}</span> lịch hôm nay</div>
    ${done > 0 ? `<div class="stat-pill"><span class="stat-n" style="color:var(--green)">${done}</span> hoàn thành</div>` : ''}
    <div class="stat-pill"><span class="stat-n" style="color:var(--accent)">${events.length}</span> tổng cộng</div>
  `;
}

// ──────────── DAY VIEW ────────────
function renderDayView() {
  const days = getWeekDays(weekOffset);
  const selDay = days[selectedDayIdx];
  const key = dateKey(selDay);

  const dayEvts = events
    .filter(e => e.dayKey === key)
    .sort((a,b) => a.start.localeCompare(b.start));

  const list = document.getElementById('eventsList');

  if (dayEvts.length === 0) {
    list.innerHTML = `<div class="no-events">
      <div class="no-icon">🗓️</div>
      <p>Chưa có lịch nào cho ngày này.<br>Nhấn <strong>+ Thêm lịch</strong> để tạo mới!</p>
    </div>`;
    return;
  }

  list.innerHTML = dayEvts.map(e => `
    <div class="event-card ${e.done?'done':''}" style="border-left-color:${e.color||'#4f46e5'}"
         onclick="openDetail('${e.id}')">
      <div class="event-time-col">
        <div class="event-time-start">${e.start}</div>
        <div class="event-dot"></div>
        <div class="event-time-end">${e.end}</div>
      </div>
      <div class="event-body">
        <div class="event-title">${e.title}</div>
        ${e.note ? `<div class="event-note">${e.note}</div>` : ''}
        ${e.tag ? `<div class="event-tags"><span class="event-tag" style="background:${e.color}22;color:${e.color}">${e.tag}</span></div>` : ''}
      </div>
      <div class="event-actions">
        <button class="event-action-btn btn-edit" onclick="event.stopPropagation();openEdit('${e.id}')">✏️</button>
        <button class="event-action-btn btn-done" onclick="event.stopPropagation();quickDone('${e.id}')">${e.done?'↩':'✓'}</button>
        <button class="event-action-btn btn-del" onclick="event.stopPropagation();deleteEvent('${e.id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

// ──────────── WEEK VIEW ────────────
function renderWeekView() {
  const days = getWeekDays(weekOffset);
  const wv = document.getElementById('weekView');

  const hours = [];
  for (let h = 6; h <= 22; h++) hours.push(h);

  let html = `<div class="week-grid-header">
    <div class="wgh-cell"></div>`;
  days.forEach((d, i) => {
    const cls = isToday(d) ? 'today-col' : '';
    html += `<div class="wgh-cell ${cls}">
      <div>${VI_DAYS[i].replace('Thứ ','T')}</div>
      <div class="wgh-date">${d.getDate()}</div>
    </div>`;
  });
  html += '</div><div class="week-time-grid">';

  hours.forEach(h => {
    html += `<div class="week-time-row">
      <div class="wtr-time">${String(h).padStart(2,'0')}:00</div>`;
    days.forEach((d, di) => {
      const key = dateKey(d);
      const cls = isToday(d) ? 'today-col' : '';
      const cellEvts = events.filter(e => {
        if (e.dayKey !== key) return false;
        const sh = parseInt(e.start.split(':')[0]);
        return sh === h;
      });
      let evtHtml = cellEvts.map(e => `
        <div class="week-event-block" style="background:${e.color||'#4f46e5'};color:white;top:4px"
             onclick="openDetail('${e.id}')"
             title="${e.title} ${e.start}-${e.end}">
          ${e.title}
        </div>`).join('');
      html += `<div class="wtr-cell ${cls}" onclick="openAddDay(${di},'${String(h).padStart(2,'0')}:00')">${evtHtml}</div>`;
    });
    html += '</div>';
  });

  html += '</div>';
  wv.innerHTML = html;
}

// ──────────── RENDER ALL ────────────
function renderAll() {
  renderHeader();
  renderDayTabs();
  renderStats();
  renderDayView();
  renderWeekView();
}

// ──────────── VIEW TOGGLE ────────────
function setView(v) {
  currentView = v;
  document.getElementById('dayView').style.display = v === 'day' ? 'block' : 'none';
  document.getElementById('weekViewWrap').style.display = v === 'week' ? 'block' : 'none';
  document.getElementById('btnDay').classList.toggle('active', v === 'day');
  document.getElementById('btnWeek').classList.toggle('active', v === 'week');
}

// ──────────── WEEK NAVIGATION ────────────
function shiftWeek(n) {
  weekOffset += n;
  renderAll();
}

function goToday() {
  weekOffset = 0;
  // select today's column
  const today = new Date();
  let dow = today.getDay(); // 0=Sun
  selectedDayIdx = dow === 0 ? 6 : dow - 1;
  renderAll();
}

// ──────────── MODAL OPEN/CLOSE ────────────
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '➕ Thêm lịch mới';
  document.getElementById('fTitle').value = '';
  document.getElementById('fStart').value = '08:00';
  document.getElementById('fEnd').value = '09:30';
  document.getElementById('fDay').value = selectedDayIdx;
  document.getElementById('fTag').value = '';
  document.getElementById('fNote').value = '';
  selectedColor = '#4f46e5';
  resetColorPicker();
  document.getElementById('modalOverlay').classList.add('show');
}

function openAddDay(dayIdx, time) {
  selectedDayIdx = dayIdx;
  openAdd();
  document.getElementById('fStart').value = time;
  document.getElementById('fDay').value = dayIdx;
}

function openEdit(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '✏️ Chỉnh sửa lịch';
  document.getElementById('fTitle').value = e.title;
  document.getElementById('fStart').value = e.start;
  document.getElementById('fEnd').value = e.end;

  // find dayIdx from dayKey
  const days = getWeekDays(weekOffset);
  const di = days.findIndex(d => dateKey(d) === e.dayKey);
  document.getElementById('fDay').value = di >= 0 ? di : 0;

  document.getElementById('fTag').value = e.tag || '';
  document.getElementById('fNote').value = e.note || '';
  selectedColor = e.color || '#4f46e5';
  resetColorPicker(selectedColor);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function resetColorPicker(active = '#4f46e5') {
  document.querySelectorAll('.color-opt').forEach(o => {
    o.classList.toggle('selected', o.dataset.color === active);
  });
}

function pickColor(el) {
  document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

// ──────────── SAVE ────────────
function saveEvent() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { document.getElementById('fTitle').focus(); return; }

  const days = getWeekDays(weekOffset);
  const di = parseInt(document.getElementById('fDay').value);
  const selDay = days[Math.min(di, 6)];

  const evt = {
    id: editingId || Date.now().toString(),
    title,
    start: document.getElementById('fStart').value,
    end: document.getElementById('fEnd').value,
    dayKey: dateKey(selDay),
    tag: document.getElementById('fTag').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    color: selectedColor,
    done: editingId ? (events.find(e=>e.id===editingId)?.done || false) : false,
  };

  if (editingId) {
    events = events.map(e => e.id === editingId ? evt : e);
  } else {
    events.push(evt);
  }

  selectedDayIdx = di;
  save();
  closeModal();
  closeDetail();
  renderAll();
}

// ──────────── DETAIL ────────────
function openDetail(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  detailId = id;

  document.getElementById('detailColorBar').style.background = e.color || '#4f46e5';
  document.getElementById('detailTitle').textContent = e.title;

  // Get readable date
  const days = getWeekDays(weekOffset);
  const d = days.find(day => dateKey(day) === e.dayKey);
  const dateStr = d ? `${VI_DAYS[days.indexOf(d)]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}` : '';
  document.getElementById('detailTime').textContent = `🕐 ${e.start} – ${e.end}  |  ${dateStr}`;

  const noteEl = document.getElementById('detailNote');
  if (e.note) { noteEl.textContent = e.note; noteEl.style.display = 'block'; }
  else { noteEl.style.display = 'none'; }

  const tagEl = document.getElementById('detailTag');
  tagEl.innerHTML = e.tag
    ? `<span class="event-tag" style="background:${e.color}22;color:${e.color}">${e.tag}</span>`
    : '';

  const doneBtn = document.getElementById('detailDoneBtn');
  doneBtn.textContent = e.done ? '↩ Bỏ hoàn thành' : '✓ Hoàn thành';
  doneBtn.style.background = e.done ? 'var(--accent-pale)' : 'var(--green-pale)';
  doneBtn.style.color = e.done ? 'var(--accent)' : 'var(--green)';

  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  detailId = null;
}

function toggleDone() {
  const e = events.find(x => x.id === detailId);
  if (!e) return;
  e.done = !e.done;
  save();
  closeDetail();
  renderAll();
}

function editFromDetail() {
  const id = detailId;
  closeDetail();
  openEdit(id);
}

function deleteFromDetail() {
  if (!detailId) return;
  if (confirm('Xóa lịch này?')) {
    deleteEvent(detailId);
    closeDetail();
  }
}

// ──────────── QUICK ACTIONS ────────────
function quickDone(id) {
  const e = events.find(x => x.id === id);
  if (e) { e.done = !e.done; save(); renderAll(); }
}

function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  save();
  renderAll();
}

// ──────────── STORAGE ────────────
function save() {
  localStorage.setItem('tkb_events', JSON.stringify(events));
}

// ──────────── CLICK OUTSIDE ────────────
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay')) closeDetail();
});

// ──────────── SAMPLE DATA ────────────
function loadSamples() {
  if (events.length > 0) return;
  const days = getWeekDays(0);
  const samples = [
    { title: 'Toán cao cấp', start: '07:30', end: '09:00', di: 0, color: '#4f46e5', tag: 'Học', note: 'Phòng A203 — ôn chương 3 trước' },
    { title: 'Lập trình Python', start: '09:30', end: '11:00', di: 0, color: '#10b981', tag: 'Học', note: 'Bài tập tuần 5' },
    { title: 'Họp nhóm dự án', start: '14:00', end: '15:30', di: 1, color: '#f59e0b', tag: 'Nhóm', note: 'Zoom — chuẩn bị slide báo cáo' },
    { title: 'Tiếng Anh', start: '07:30', end: '09:00', di: 2, color: '#ec4899', tag: 'Học', note: 'Listening + Speaking Unit 7' },
    { title: 'Thể dục', start: '16:00', end: '17:30', di: 3, color: '#84cc16', tag: 'Cá nhân', note: '' },
    { title: 'Vật lý đại cương', start: '09:30', end: '11:00', di: 4, color: '#8b5cf6', tag: 'Học', note: 'Phòng Lab B1 — mang máy tính' },
  ];
  samples.forEach(s => {
    events.push({
      id: Date.now().toString() + Math.random(),
      title: s.title,
      start: s.start,
      end: s.end,
      dayKey: dateKey(days[s.di]),
      tag: s.tag,
      note: s.note,
      color: s.color,
      done: false,
    });
  });
  save();
}

// ──────────── INIT ────────────
function init() {
  // select today
  const today = new Date();
  let dow = today.getDay();
  selectedDayIdx = dow === 0 ? 6 : dow - 1;

  loadSamples();
  renderAll();
}

init();
</script>
</body>
</html>
